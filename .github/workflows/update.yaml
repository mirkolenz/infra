name: update
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
cache-mode: none
jobs:
  update:
    name: update
    runs-on: ubuntu-26.04
    permissions:
      contents: write # merges the update pull request once its checks pass
      pull-requests: write # enables auto-merge on the update pull request
    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write # pushes the bumped actions
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: set up git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            accept-flake-config = true
      - uses: cachix/cachix-action@v17
        with:
          name: mirkolenz
      - run: nix run . -- update all
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_MIN_AGE: 3
      - name: remove unstaged changes
        run: git restore .
      - name: build pr body
        run: git log --reverse --format='## %s%n%n%b' "$GITHUB_SHA..HEAD" > "$RUNNER_TEMP/pr-body.md"
      - uses: peter-evans/create-pull-request@v8 # zizmor: ignore[superfluous-actions]
        id: pr
        with:
          token: ${{ steps.generate-token.outputs.token }}
          branch: update-deps
          delete-branch: true
          title: "chore(deps): update"
          body-path: ${{ runner.temp }}/pr-body.md
      - name: automerge
        run: gh pr merge --auto --rebase "$PR"
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
