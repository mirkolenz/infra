name: checks
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# The branch rule requires only the aggregate `check-all` job:
# https://github.com/mirkolenz/infra/settings/rules/3352950
jobs:
  check-eval:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: DeterminateSystems/determinate-nix-action@4eea0b33e3d1f02ecfe37cf16e7204c424009606 # v3
        with:
          extra-conf: |
            accept-flake-config = true
            log-lines = 200
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: mirkolenz
          authToken: ${{ secrets.CACHIX_TOKEN }}
      - run: nix fmt -- --ci
      - run: nix flake check --no-build --show-trace
  check-system:
    name: check-${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
          - system: aarch64-linux
            runner: ubuntu-26.04-arm
          - system: x86_64-linux
            runner: ubuntu-26.04
          - system: aarch64-darwin
            runner: macos-26
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: reclaim linux disk space
        if: runner.os == 'Linux'
        uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      - name: reclaim darwin disk space
        if: runner.os == 'macOS'
        run: |
          for path in /Applications/Xcode*.app /Library/Developer "$RUNNER_TOOL_CACHE"; do
            sudo rm -rf "$path" &
          done
      - uses: DeterminateSystems/determinate-nix-action@4eea0b33e3d1f02ecfe37cf16e7204c424009606 # v3
        with:
          extra-conf: |
            accept-flake-config = true
            build-dir = /nix/build
            cores = 0
            eval-cores = 0
            fallback = true
            keep-going = true
            log-lines = 200
            max-jobs = 1
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: mirkolenz
          authToken: ${{ secrets.CACHIX_TOKEN }}
      - run: nix run . -- build-pkgs --show-trace
  check-all:
    needs:
      - check-eval
      - check-system
    runs-on: ubuntu-slim
    if: always()
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: for result in $RESULTS; do [[ "$result" == success ]] || exit 1; done
