name: checks
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
cache-mode: none
# The branch rule requires only the aggregate `check-all` job:
# https://github.com/mirkolenz/infra/settings/rules/3352950
# `check flake` evaluates everything the build jobs leave out, the build jobs
# evaluate and build the CI targets of their system. Together they cover what
# `nix flake check --all-systems` checks, each derivation evaluated once.
# Limits follow the hardware of the standard runners for public repositories:
# https://docs.github.com/en/actions/reference/runners/github-hosted-runners
# `check flake` leaves about 3 GB of the runner to the system, two workers
# keep more of nixpkgs cached than four. The build jobs evaluate in seconds.
jobs:
  check-flake:
    name: check-flake
    # 4 vCPU, 16 GB RAM
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
      - run: nix run . -- check flake --workers 2 --max-memory-size 6656
  check-build:
    name: check-build-${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # 4 vCPU, 16 GB RAM
          - system: aarch64-linux
            runner: ubuntu-26.04-arm
            max-jobs: 4
            sandbox: true
          # 4 vCPU, 16 GB RAM
          - system: x86_64-linux
            runner: ubuntu-26.04
            max-jobs: 4
            sandbox: true
          # 3 vCPU, 7 GB RAM
          - system: aarch64-darwin
            runner: macos-26
            max-jobs: 3
            sandbox: relaxed
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: reclaim linux disk space
        if: runner.os == 'Linux'
        uses: wimpysworld/nothing-but-nix@v11
      - name: reclaim darwin disk space
        if: runner.os == 'macOS'
        background: true
        run: |
          for path in /Applications/Xcode*.app /Library/Developer "$RUNNER_TOOL_CACHE"; do
            sudo rm -rf "$path"
          done
      - uses: $/.github/actions/setup-nix
        with:
          # the sandbox mode follows modules/nix/settings.nix
          # nix-fast-build does not pass `--max-jobs` on, so every build
          # realizes its own dependencies one at a time
          # parallel heavy builds with all cores each exhaust the memory
          extra-conf: |
            build-dir = /nix/build
            cores = 2
            fallback = true
            keep-going = true
            max-jobs = 1
            sandbox = ${{ matrix.sandbox }}
      # pushes the runtime closures of the built targets, leaving out build-only fetches
      - run: nix run . -- check build --max-memory-size 2048 --no-nom --max-jobs "$MAX_JOBS" --cachix-cache mirkolenz
        env:
          MAX_JOBS: ${{ matrix.max-jobs }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_TOKEN }}
  check-all:
    name: check-all
    needs:
      - check-flake
      - check-build
    runs-on: ubuntu-slim
    if: always()
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: for result in $RESULTS; do [[ "$result" == success ]] || exit 1; done
