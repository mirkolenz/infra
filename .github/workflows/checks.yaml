name: checks
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# keep job names in sync: https://github.com/mirkolenz/infra/settings/rules/3352950
jobs:
  # Formatting is platform-independent, so it runs once rather than per system.
  check-fmt:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: DeterminateSystems/determinate-nix-action@4eea0b33e3d1f02ecfe37cf16e7204c424009606 # v3
        with:
          extra-conf: |
            accept-flake-config = true
            log-lines = 200
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: mirkolenz
          authToken: ${{ secrets.CACHIX_TOKEN }}
      - run: nix fmt -- --ci
  # Evaluation is platform-independent (no import-from-derivation), so every
  # system is evaluated on the x86_64 runner. Separate from the builds so a check
  # bounded at minutes is not buried behind one that can run for hours.
  check-eval:
    name: check-eval-${{ matrix.system }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        system:
          - aarch64-darwin
          - aarch64-linux
          - x86_64-linux
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: DeterminateSystems/determinate-nix-action@4eea0b33e3d1f02ecfe37cf16e7204c424009606 # v3
        with:
          extra-conf: |
            accept-flake-config = true
            eval-cores = 0
            log-lines = 200
      # Covers apps, devShells, packages, checks and overlays, and through the
      # `eval-*` checks every configuration; see options/flake-parts/eval-checks.nix
      # for why the configuration outputs alone are not enough. `--system`
      # selects which system it reports on.
      - run: nix flake check --no-build --system ${{ matrix.system }} --show-trace
  check-build:
    name: check-build-${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
          - system: aarch64-linux
            runner: ubuntu-26.04-arm
          - system: x86_64-linux
            runner: ubuntu-26.04
          - system: aarch64-darwin
            runner: macos-26
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      - uses: DeterminateSystems/determinate-nix-action@4eea0b33e3d1f02ecfe37cf16e7204c424009606 # v3
        with:
          extra-conf: |
            accept-flake-config = true
            build-dir = /nix/build
            cores = 0
            eval-cores = 1
            fallback = true
            keep-going = true
            log-lines = 200
            max-jobs = 1
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: mirkolenz
          authToken: ${{ secrets.CACHIX_TOKEN }}
      - run: nix run . -- build-pkgs --show-trace
