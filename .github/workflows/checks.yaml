name: checks
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# The branch rule requires only the aggregate `check-all` job:
# https://github.com/mirkolenz/infra/settings/rules/3352950
# check-flake evaluates everything the build jobs leave out, the build jobs
# evaluate and build the CI targets of their system. Together they cover what
# `nix flake check --all-systems` checks, each derivation evaluated once.
# Limits follow the hardware of the standard runners for public repositories:
# https://docs.github.com/en/actions/reference/runners/github-hosted-runners
# check-flake leaves about 3 GB of the runner to the system, two workers
# keep more of nixpkgs cached than four. The build jobs evaluate in seconds.
jobs:
  check-flake:
    # 4 vCPU, 16 GB RAM
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: DeterminateSystems/determinate-nix-action@4eea0b33e3d1f02ecfe37cf16e7204c424009606 # v3
        with:
          summarize: false
          extra-conf: |
            accept-flake-config = true
            eval-cores = 1
            log-lines = 200
      - run: nix run . -- check-flake --workers 2 --max-memory-size 6656
  check-build:
    name: check-build-${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 4 vCPU, 16 GB RAM
          - system: aarch64-linux
            runner: ubuntu-26.04-arm
            max-jobs: 4
          # 4 vCPU, 16 GB RAM
          - system: x86_64-linux
            runner: ubuntu-26.04
            max-jobs: 4
          # 3 vCPU, 7 GB RAM
          - system: aarch64-darwin
            runner: macos-26
            max-jobs: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: reclaim linux disk space
        if: runner.os == 'Linux'
        uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      - name: reclaim darwin disk space
        if: runner.os == 'macOS'
        run: |
          for path in /Applications/Xcode*.app /Library/Developer "$RUNNER_TOOL_CACHE"; do
            sudo rm -rf "$path" &
          done
      - uses: DeterminateSystems/determinate-nix-action@4eea0b33e3d1f02ecfe37cf16e7204c424009606 # v3
        with:
          summarize: false
          # nix-fast-build does not pass `--max-jobs` on, so every build
          # realizes its own dependencies one at a time
          extra-conf: |
            accept-flake-config = true
            build-dir = /nix/build
            cores = 0
            eval-cores = 1
            fallback = true
            keep-going = true
            log-lines = 200
            max-jobs = 1
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: mirkolenz
          authToken: ${{ secrets.CACHIX_TOKEN }}
      - run: nix run . -- check-build --max-memory-size 2048 --no-nom --max-jobs ${{ matrix.max-jobs }}
  check-all:
    needs:
      - check-flake
      - check-build
    runs-on: ubuntu-slim
    if: always()
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: for result in $RESULTS; do [[ "$result" == success ]] || exit 1; done
